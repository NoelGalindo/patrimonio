# Despliegue de pruebas: PostgreSQL + backend (Spring Boot) + web (nginx con el frontend).
# Solo "web" publica un puerto; la base de datos y el backend quedan en la red interna.
# Uso: cp .env.example .env  (y llenar los valores)  →  docker compose up -d --build

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: patrimonio
      POSTGRES_USER: patrimonio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      TZ: America/Mexico_City
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patrimonio -d patrimonio"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend/patrimonio
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/patrimonio
      DB_USER: patrimonio
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (32+ caracteres)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    mem_limit: 2g

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  pgdata:
