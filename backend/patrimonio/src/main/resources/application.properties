spring.application.name=patrimonio

# --- Base de datos (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/patrimonio}
spring.datasource.username=${DB_USER:patrimonio}
spring.datasource.password=${DB_PASSWORD:patrimonio}

# Flyway es el dueño del esquema; Hibernate solo valida que coincida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
spring.flyway.locations=classpath:db/migration

# --- Seguridad ---
# Clave HMAC para firmar los JWT (mínimo 32 caracteres). Definir JWT_SECRET en producción.
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-de-desarrollo-por-una-segura-123456}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Primer administrador: se crea al iniciar solo si no existe ningún ADMINISTRADOR
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

server.error.include-message=never
