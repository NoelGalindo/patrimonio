server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 20m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: se reenvía al backend por la red interna de Docker
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Para el navegador es el mismo origen; sin Origin, Spring no la trata como CORS
        proxy_set_header Origin "";
        proxy_read_timeout 120s;
    }

    # Archivos con hash en el nombre: se pueden guardar en caché mucho tiempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rutas de React (react-router): cualquier otra ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
